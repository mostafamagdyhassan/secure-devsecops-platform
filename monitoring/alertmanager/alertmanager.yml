global:
  resolve_timeout: 5m

route:
  receiver: default-receiver
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-receiver

receivers:
  - name: default-receiver

  - name: critical-receiver
