apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-devsecops-platform
  namespace: secure-app
  labels:
    app: secure-devsecops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-devsecops-platform
  template:
    metadata:
      labels:
        app: secure-devsecops-platform
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: REPLACE_WITH_ECR_IMAGE_URI
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
